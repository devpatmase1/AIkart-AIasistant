services:
  # NexusRAG Backend API Service
  - type: web
    name: nexusrag-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nexusrag.db
      - key: NEXUSRAG_DOCUMENT_PARSER
        value: fast
      - key: LLM_MODEL_FAST
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: '["*"]'

  # NexusRAG Frontend UI Static Site
  - type: static
    name: nexusrag-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
